[package]
name = "pulse-desktop"
version = "0.6.0"
description = "Pulse — voice-first AI side panel"
authors = ["Roman"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "pulse_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.1", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2.3"
tauri-plugin-autostart = "2.3"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
urlencoding = "2"
tokio = { version = "1", features = ["full"] }
scraper = "0.20"
xcap = "0.9"
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.22"
# Pulse v5 — agentic AI: app/game launching + system introspection
# sysinfo с дефолтными фичами — небольшая крейт, проще не воевать с feature-гейтами.
sysinfo = "0.32"
winreg = "0.52"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
