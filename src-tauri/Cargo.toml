[package]
name = "pulse-desktop"
version = "0.6.8"
description = "Pulse — voice-first AI side panel"
authors = ["Roman"]
edition = "2021"
rust-version = "1.77"
default-run = "pulse-desktop"

[lib]
name = "pulse_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "pulse-desktop"
path = "src/main.rs"

[[bin]]
name = "eval_r86"
path = "src/bin/eval_r86.rs"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.1", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2.3"
tauri-plugin-autostart = "2.3"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
urlencoding = "2"
tokio = { version = "1", features = ["full"] }
scraper = "0.20"
xcap = "0.9"
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.22"
# Pulse v5 — agentic AI: app/game launching + system introspection
# sysinfo с дефолтными фичами — небольшая крейт, проще не воевать с feature-гейтами.
sysinfo = "0.32"
winreg = "0.52"
# R82: tree-sitter для code-aware Smart Engine v3 routing.
# Решает R79 Eval Harness §5.3: marker-regex не отличает "show me Rust code" от
# "explain how Vec::new() works". Tree-sitter парсит AST и подтверждает наличие
# function/class/import. Детект становится structural, а не lexical.
# Cargo registry уже содержит ~700MB кэша, докачается ~5-10MB.
tree-sitter = "0.25"
tree-sitter-rust = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.23"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
