name: Build Pulse Linux (.deb)

# R-BuildLinux: Tauri 2.x build for Ubuntu 22.04+ (.deb)
# Uses Tauri CLI's --bundles deb to produce:
#   src-tauri/target/release/bundle/deb/Pulse_0.6.9_amd64.deb
# Install: sudo dpkg -i Pulse_0.6.9_amd64.deb && sudo apt-get install -f
#
# If externalBin (ollama) is missing, this will fail at bundle step —
# the Tauri config still references it for Windows. See note below.

on:
  workflow_dispatch:
  push:
    branches: [main, master, develop]
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-linux.yml'

permissions:
  contents: read

jobs:
  build-deb:
    name: Build .deb on Ubuntu 22.04
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Tauri 2.x Linux build deps
        # Per https://v2.tauri.app/start/prerequisites/#linux
        # webkit2gtk-4.1 is the new default; webkit2gtk-4.0 also supported.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - name: Install npm deps
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build .deb
        working-directory: src-tauri
        # Tauri will look for binaries/ollama-x86_64-unknown-linux-gnu
        # because externalBin is in tauri.conf.json. If that file is
        # missing, the bundle step will fail — drop externalBin or
        # supply the sidecar in src-tauri/binaries/ to fix.
        run: |
          npx --yes @tauri-apps/cli@^2 build --bundles deb \
            --target x86_64-unknown-linux-gnu

      - name: Verify .deb
        run: |
          set -e
          DEB=$(find src-tauri/target -name '*.deb' -path '*release/bundle/deb/*' | head -n 1)
          if [ -z "$DEB" ]; then
            echo "::error::No .deb produced"
            ls -laR src-tauri/target/release/bundle/ 2>/dev/null || true
            exit 1
          fi
          echo "Built: $DEB"
          du -h "$DEB"
          dpkg-deb --info "$DEB"

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: pulse-desktop-deb
          path: src-tauri/target/**/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 30
